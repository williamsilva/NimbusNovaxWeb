<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Novax">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#g)" filter="url(#s)"/>

  <!-- voucher/ticket motif -->
  <rect x="30" y="46" width="68" height="32" rx="8" fill="none" stroke="#fff7ed" stroke-opacity="0.9" stroke-width="6"/>
  <circle cx="64" cy="46" r="7" fill="url(#g)"/>
  <circle cx="64" cy="78" r="7" fill="url(#g)"/>
  <line x1="64" y1="55" x2="64" y2="69" stroke="#fff7ed" stroke-opacity="0.6" stroke-width="4" stroke-dasharray="2 4" stroke-linecap="round"/>

  <!-- NV monogram -->
  <text x="64" y="103" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="24" font-weight="800" fill="#ffffff">NV</text>
</svg>
