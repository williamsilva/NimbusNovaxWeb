<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-label="Novax">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="140" height="140" rx="34" fill="url(#g)"/>
    <rect x="33" y="50" width="74" height="35" rx="9" fill="none" stroke="#fff7ed" stroke-opacity="0.9" stroke-width="6.5"/>
    <circle cx="70" cy="50" r="7.5" fill="url(#g)"/>
    <circle cx="70" cy="85" r="7.5" fill="url(#g)"/>
    <line x1="70" y1="60" x2="70" y2="75" stroke="#fff7ed" stroke-opacity="0.6" stroke-width="4.5" stroke-dasharray="2 4.5" stroke-linecap="round"/>
    <text x="70" y="121" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="26" font-weight="800" fill="#ffffff">NV</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(190,66)">
    <text x="0" y="0" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="56" font-weight="800" fill="#0b1220">Novax</text>
    <text x="2" y="44" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="20" font-weight="600" fill="#475569">Gestão de Acessos</text>
