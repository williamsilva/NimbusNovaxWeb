<cs-page-header
  [subtitle]="'voucher.config.subtitle' | translate"
  [breadcrumb]="[
    { label: ('menu.settings.title' | translate), url: '/settings' },
    { label: ('routes.settings.voucher.title' | translate) },
  ]"
></cs-page-header>

<p-card class="mt-2 block">
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="grid formgrid gap-0">
      <div class="col-12 md:col-3 p-2">
        <div class="flex align-items-center justify-content-between border-1 surface-border border-round p-3 h-full gap-3">
          <label for="senderMail" class="text-sm flex-1">{{ 'voucher.config.senderMail' | translate }}</label>
          <p-toggleswitch formControlName="senderMail" inputId="senderMail"></p-toggleswitch>
        </div>
      </div>

      <div class="col-12 md:col-3 p-2">
        <p-floatLabel variant="on" class="w-full">
          <p-inputNumber
            [min]="1"
            [max]="365"
            class="w-full"
            inputId="daysToExpire"
            [showButtons]="true"
            formControlName="daysToExpire"
            incrementButtonIcon="pi pi-plus"
            decrementButtonIcon="pi pi-minus"
          ></p-inputNumber>
          <label for="daysToExpire">{{ 'voucher.config.daysToExpire' | translate }}</label>
        </p-floatLabel>
      </div>

      <div class="col-12 md:col-3 p-2">
        <p-floatLabel variant="on" class="w-full">
          <p-inputNumber
            [min]="1"
            [max]="365"
            class="w-full"
            inputId="daysToCancel"
            [showButtons]="true"
            formControlName="daysToCancel"
            incrementButtonIcon="pi pi-plus"
            decrementButtonIcon="pi pi-minus"
          ></p-inputNumber>
          <label for="daysToCancel">{{ 'voucher.config.daysToCancel' | translate }}</label>
        </p-floatLabel>
      </div>

      <div class="col-12 md:col-3 p-2">
        <p-floatLabel variant="on" class="w-full">
          <p-inputNumber
            [min]="1"
            [max]="365"
            class="w-full"
            [showButtons]="true"
            inputId="numberPendingVouchers"
            formControlName="numberPendingVouchers"
            incrementButtonIcon="pi pi-plus"
            decrementButtonIcon="pi pi-minus"
          ></p-inputNumber>
          <label for="numberPendingVouchers">{{ 'voucher.config.numberPendingVouchers' | translate }}</label>
        </p-floatLabel>
      </div>

      <div class="col-12 p-2">
        <label class="text-sm text-color-secondary block mb-2">{{ 'voucher.config.notificationRecipients' | translate }}</label>
        @if (notificationRecipients().length) {
          <div class="flex flex-wrap gap-2">
            @for (recipient of notificationRecipients(); track recipient.username) {
              <cs-tag [value]="recipient.name" tone="info" [pTooltip]="recipient.username" />
            }
          </div>
        } @else {
          <small class="text-color-secondary">{{ 'voucher.config.notificationRecipientsEmpty' | translate }}</small>
        }
        <small class="text-color-secondary block mt-2">{{ 'voucher.config.notificationRecipientsHint' | translate }}</small>
      </div>

      <div class="col-12 p-2">
        <p-floatLabel variant="on" class="w-full">
          <textarea
            pTextarea
            id="emailBody"
            rows="6"
            class="w-full"
            formControlName="emailBody"
          ></textarea>
          <label for="emailBody">{{ 'voucher.config.emailBody' | translate }}</label>
        </p-floatLabel>
      </div>
    </div>

    @if (canEdit()) {
      <div class="mt-4 px-2">
        <p-button
          type="submit"
          icon="pi pi-save"
          [label]="'common.save' | translate"
          [disabled]="form.invalid"
        ></p-button>
      </div>
    }
  </form>
</p-card>
