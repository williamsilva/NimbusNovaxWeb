<p-dialog
  [modal]="true"
  appendTo="body"
  [closable]="false"
  (onHide)="onHide()"
  [draggable]="false"
  [resizable]="false"
  [visible]="visible()"
  [style]="{ width: '760px', maxWidth: '95vw' }"
  [header]="isEditMode() ? ('produtos.edit.title' | translate) : ('produtos.new.title' | translate)"
>
  <form [formGroup]="form" class="cs-dialog-form">
    <div class="grid formgrid gap-0">
      <div class="col-12 md:col-6 p-2">
        <p-floatLabel variant="on" class="w-full">
          <input
            id="name"
            pInputText
            type="text"
            formControlName="name"
            class="w-full p-inputtext-sm"
          />
          <app-error-msg
            [field]="'name'"
            [forId]="'name'"
            [showTechnicalDetails]="true"
            [control]="form.controls.name"
            [label]="'produtos.fields.name' | translate"
          />
        </p-floatLabel>
      </div>

      <div class="col-12 md:col-6 p-2">
        <p-floatLabel variant="on" class="w-full">
          <p-select
            size="small"
            appendTo="body"
            inputId="typeProduct"
            styleClass="w-full"
            optionLabel="label"
            optionValue="value"
            [options]="typeProductOptions()"
            formControlName="typeProduct"
          ></p-select>
          <label for="typeProduct">{{ 'produtos.fields.typeProduct' | translate }}</label>
        </p-floatLabel>
      </div>

      <div class="col-12 md:col-6 p-2">
        <p-floatLabel variant="on" class="w-full">
          <p-inputNumber
            inputId="amount"
            mode="currency"
            [currency]="currency"
            [locale]="locale"
            styleClass="w-full"
            formControlName="amount"
          ></p-inputNumber>
          <label for="amount">{{ 'produtos.fields.amount' | translate }}</label>
        </p-floatLabel>
        @if (
          !isCourtesy() &&
          form.errors?.['amountRequiredUnlessCourtesy'] &&
          (form.dirty || form.touched)
        ) {
          <small class="p-error">{{
            'produtos.fields.amountRequiredUnlessCourtesy' | translate
          }}</small>
        }
      </div>

      <div class="col-12 md:col-6 p-2">
        <p-floatLabel variant="on" class="w-full">
          <p-select
            size="small"
            appendTo="body"
            inputId="status"
            styleClass="w-full"
            optionLabel="label"
            optionValue="value"
            [options]="statusOptions()"
            formControlName="status"
          ></p-select>
          <label for="status">{{ 'produtos.fields.status' | translate }}</label>
        </p-floatLabel>
      </div>

      <div class="col-12 md:col-6 p-2">
        <p-floatLabel variant="on" class="w-full">
          <p-datepicker
            appendTo="body"
            inputId="initialValidate"
            csDateInputMask
            [showIcon]="true"
            styleClass="w-full"
            [dateFormat]="i18n.getDateFormat()"
            [readonlyInput]="false"
            formControlName="initialValidate"
            [csDateInputMaskFormat]="i18n.getDateFormat()"
          ></p-datepicker>
          <label for="initialValidate">{{ 'produtos.fields.initialValidate' | translate }}</label>
        </p-floatLabel>
      </div>

      <div class="col-12 md:col-6 p-2">
        <p-floatLabel variant="on" class="w-full">
          <p-datepicker
            appendTo="body"
            inputId="finalValidate"
            csDateInputMask
            [showIcon]="true"
            styleClass="w-full"
            [dateFormat]="i18n.getDateFormat()"
            [readonlyInput]="false"
            formControlName="finalValidate"
            [csDateInputMaskFormat]="i18n.getDateFormat()"
          ></p-datepicker>
          <label for="finalValidate">{{ 'produtos.fields.finalValidate' | translate }}</label>
        </p-floatLabel>
      </div>

      <div class="col-12 p-2">
        <p-floatLabel variant="on" class="w-full">
          <input
            id="description"
            pInputText
            type="text"
            formControlName="description"
            class="w-full p-inputtext-sm"
          />
          <app-error-msg
            [field]="'description'"
            [forId]="'description'"
            [showTechnicalDetails]="true"
            [control]="form.controls.description"
            [label]="'produtos.fields.description' | translate"
          />
        </p-floatLabel>
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      (click)="close()"
      icon="pi pi-times"
      class="p-button-text p-button-sm"
      [label]="'common.cancel' | translate"
      [disabled]="saving()"
    ></button>

    <button
      pButton
      type="button"
      (click)="save()"
      icon="pi pi-save"
      class="p-button-sm"
      [loading]="saving()"
      [label]="'common.save' | translate"
      [disabled]="saving() || !canSubmit()"
    ></button>
  </ng-template>
</p-dialog>
