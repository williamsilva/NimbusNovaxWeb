# Sobe o frontend do NimbusNovax sozinho (ng serve em container, live-reload). Uso normal é via
# ../docker-compose.yml (na raiz do produto, "include:" deste arquivo + do
# NimbusNovaxServer/docker-compose.yml) - rode daqui direto só se já tiver o backend rodando de
# outro jeito e só quiser o frontend em container.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      # NODE_AUTH_TOKEN: mesmo achado do NimbusDeskWeb - o .npmrc do projeto (@williamsilva/registry)
      # precisa dessa var pra autenticar no GitHub Packages durante `npm ci`. Sete num .env (não
      # commitado). Via secrets (não args/build-arg) - achado real 2026-09-19: build-arg (+ o
      # antigo `ENV NODE_AUTH_TOKEN=$NODE_AUTH_TOKEN` do Dockerfile.dev) deixava o token gravado
      # permanentemente na imagem/container; secret só existe durante o RUN que o monta
      # explicitamente, mesmo padrão já usado no CardSyncWeb.
      secrets:
        - node_auth_token
    ports:
      # 4203 - convenção do workspace (cardsync 4201, nimbusflow 4202, nimbusnovax 4203, nimbusdesk 4204).
      - "127.0.0.1:4203:4203"
    environment:
      # Bind mount em Docker Desktop (Windows/Mac) não dispara eventos de fs nativos - sem
      # polling o ng serve não percebe alterações no código.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
      - web-angular-cache:/workspace/.angular

volumes:
  web-node-modules:
  web-angular-cache:

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN
